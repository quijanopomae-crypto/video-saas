name: Bootstrap Dev Infra Checkpoint

on:
  push:
    branches: [dev-infra-001]
    paths:
      - '.bootstrap/dev-infra-ready.txt'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install projectctl dependency
        run: python -m pip install --quiet pyyaml

      - name: Remove temporary bootstrap files from final index
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/dev-infra-checkpoint.yml
          git add -A .bootstrap .github/workflows/dev-infra-checkpoint.yml

      - name: Create durable development checkpoint
        run: |
          python -B -m projectctl checkpoint             --reason "Activate TASK-DEV-INFRA-001 after materializing the development skeleton"             --next-action "Open the development infrastructure PR and require Repository Control CI plus Product CI."

      - name: Commit checkpoint and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state
          git commit -m "chore: checkpoint development infrastructure task"
          git push
