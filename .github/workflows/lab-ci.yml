name: Lab CI

on:
  pull_request:
    paths:
      - 'lab/**'
      - 'AGENTS.md'
      - 'PROJECT_STATE.yaml'
      - 'tasks/TASK-PRODUCT-LAB-001.yaml'
      - '.state/**'
      - '.github/workflows/lab-ci.yml'
  push:
    branches: [main, 'lab-*']
    paths:
      - 'lab/**'
      - 'AGENTS.md'
      - 'PROJECT_STATE.yaml'
      - 'tasks/TASK-PRODUCT-LAB-001.yaml'
      - '.state/**'
      - '.github/workflows/lab-ci.yml'

permissions:
  contents: read

jobs:
  lab-product-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install repository-control dependency
        run: python -m pip install --quiet pyyaml==6.0.3

      - name: Print repository snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from projectctl.core import git_snapshot
          print("LAB_REPOSITORY_SNAPSHOT=" + json.dumps(git_snapshot(Path.cwd()), sort_keys=True))
          PY

      - name: Run lab unit tests
        working-directory: lab/experiments/product-flow-001
        run: python -m unittest discover -s tests -v

      - name: Run deterministic lab demo
        working-directory: lab/experiments/product-flow-001
        run: |
          python run_demo.py fixtures/project_request.json > /tmp/product-flow.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/product-flow.json", encoding="utf-8"))
          assert data["preview_plan"]["total_duration_sec"] == data["request"]["duration_sec"]
          assert len(data["scene_graph"]) >= 1
          assert len(data["shot_contracts"]) >= len(data["scene_graph"])
          print("LAB_PRODUCT_FLOW_001_OK")
          PY
