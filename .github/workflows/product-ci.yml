name: Product CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: video_saas
          POSTGRES_USER: video_saas
          POSTGRES_PASSWORD: video_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_saas -d video_saas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://video_saas:video_saas@127.0.0.1:5432/video_saas
      CORS_ORIGINS: http://localhost:3000
      STORAGE_BACKEND: memory
      QUEUE_BACKEND: memory
      WORKFLOW_BACKEND: memory
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet -r apps/api/requirements.txt

      - name: Apply database migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run API tests
        working-directory: apps/api
        run: python -m pytest tests

      - name: Run FFmpeg deterministic smoke
        working-directory: apps/api
        run: python -m src.workers.render --smoke /tmp/video-saas-smoke.mp4

      - name: Boot API and verify health/readiness
        working-directory: apps/api
        shell: bash
        run: |
          python -m uvicorn src.main:app --host 127.0.0.1 --port 8000 > /tmp/video-saas-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready

      - name: Check tracked files for obvious secrets
        run: python scripts/check_no_secrets.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Run frontend structural tests
        working-directory: apps/web
        run: npm test

      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  integration-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: video_saas
          POSTGRES_USER: video_saas
          POSTGRES_PASSWORD: video_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_saas -d video_saas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://video_saas:video_saas@127.0.0.1:5432/video_saas
      CORS_ORIGINS: http://127.0.0.1:3000
      STORAGE_BACKEND: memory
      QUEUE_BACKEND: memory
      WORKFLOW_BACKEND: memory
      API_INTERNAL_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install application dependencies
        run: |
          python -m pip install --quiet -r apps/api/requirements.txt
          cd apps/web
          npm install --no-audit --no-fund

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Boot API and Web, then verify Web to API path
        shell: bash
        run: |
          (cd apps/api && python -m uvicorn src.main:app --host 127.0.0.1 --port 8000) > /tmp/api.log 2>&1 &
          API_PID=$!
          (cd apps/web && npm run dev -- --hostname 127.0.0.1 --port 3000) > /tmp/web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT

          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/web.html; then break; fi
            sleep 1
          done

          grep -q "VIDEO-SAAS" /tmp/web.html
          curl -fsS http://127.0.0.1:3000/api/health >/tmp/proxy-health.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/proxy-health.json", encoding="utf-8"))
          assert data["status"] == "ok", data
          assert data["service"] == "video-saas-api", data
          print("WEB_TO_API_SMOKE_OK")
          PY
