name: Remediation Lock Bootstrap

on:
  push:
    branches: [task-audit-remediation-001-c]
    paths:
      - '.github/workflows/remediation-lock-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Generate npm lockfile from current package manifest
        shell: bash
        run: |
          cd apps/web
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "PACKAGE_LOCK_B64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "PACKAGE_LOCK_B64_END"

      - name: Resolve current Python environment in a clean venv
        shell: bash
        run: |
          python -m venv /tmp/video-saas-lock-venv
          /tmp/video-saas-lock-venv/bin/python -m pip install --disable-pip-version-check --quiet -r apps/api/requirements.txt
          /tmp/video-saas-lock-venv/bin/python -m pip freeze | LC_ALL=C sort > /tmp/requirements.lock.txt
          echo "PYTHON_LOCK_B64_BEGIN"
          base64 -w0 /tmp/requirements.lock.txt
          echo
          echo "PYTHON_LOCK_B64_END"
