name: Repository Control CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-control:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3 jsonschema==4.26.0

      - name: Resolve scope base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Task Contract scope
        shell: bash
        run: |
          if [[ -n "${{ steps.base.outputs.ref }}" ]]; then
            python -B -m projectctl check-scope --base-ref "${{ steps.base.outputs.ref }}"
          else
            python -B -m projectctl check-scope
          fi

      - name: Validate operational ACTIVE/IDLE state
        run: python -B -m projectctl validate-state

      - name: Run repository-control regression suite
        run: python -B -m pytest -q -p no:cacheprovider tests

      - name: Fresh-session durable handoff probe
        run: python -B scripts/fresh_session_probe.py --root .
