name: Repository Control CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-control:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet pytest pyyaml jsonschema

      - name: Resolve scope base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Task Contract scope
        shell: bash
        run: |
          if [[ -n "${{ steps.base.outputs.ref }}" ]]; then
            python -B -m projectctl check-scope --base-ref "${{ steps.base.outputs.ref }}"
          else
            python -B -m projectctl check-scope
          fi

      - name: Run repository-control regression suite
        run: python -B -m pytest -q -p no:cacheprovider tests

      - name: Fresh-session durable handoff probe
        run: python -B scripts/fresh_session_probe.py --root .

  sync-phase-d-state:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: trigger Phase D state sync' }}"
    needs: repository-control
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet pytest pyyaml jsonschema

      - name: Synchronize durable Phase D blocked state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import yaml

          root = Path(".")
          task_path = root / "tasks" / "TASK-REPO-CONTROL-004.yaml"
          task = yaml.safe_load(task_path.read_text(encoding="utf-8"))
          task["task"]["status"] = "BLOCKED"
          task_path.write_text(yaml.safe_dump(task, sort_keys=False, allow_unicode=True), encoding="utf-8")
          task_sha = hashlib.sha256(task_path.read_bytes()).hexdigest()

          project_path = root / "PROJECT_STATE.yaml"
          project = yaml.safe_load(project_path.read_text(encoding="utf-8"))
          project["repository_control_plane"]["implementation_status"] = "PHASE_D_BLOCKED_BRANCH_PROTECTION"
          project["current_authorized_phase"] = "PHASE_D"
          project["provider_preflight_allowed"] = False
          project["paid_provider_requests_allowed"] = False
          phase_d = project.setdefault("phase_d", {})
          phase_d["software_demonstration_status"] = "PASS_REMOTE_EXCEPT_BRANCH_PROTECTION"
          phase_d["regression_tests"] = "58/58"
          phase_d["phase_d_tests"] = "12/12"
          phase_d["fresh_session_process_probe"] = "PASS"
          phase_d["persisted_checkpoint_fresh_clone"] = "PASS"
          phase_d["ci_status"] = "PASS_REMOTE"
          phase_d["branch_protection_status"] = "BLOCKED_GITHUB_PLAN_OR_INTEGRATION"
          phase_d["ci_run_id"] = 35512907861
          phase_d["ci_head_sha"] = "5aeca47430ab10775b2df10c5c8ffa59f6097845"
          project["next_gate"] = "BRANCH_PROTECTION_REQUIRED_FOR_PHASE_D_PASS"
          project_path.write_text(yaml.safe_dump(project, sort_keys=False, allow_unicode=True), encoding="utf-8")

          evidence_path = root / "evidence" / "PHASE-D-CI.json"
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          evidence["run_id"] = 35512907861
          evidence["head_sha"] = "5aeca47430ab10775b2df10c5c8ffa59f6097845"
          evidence["conclusion"] = "success"
          evidence["observed_checks"]["scope"] = "SCOPE_OK"
          evidence["observed_checks"]["regression_tests"] = "58/58 PASS"
          evidence["observed_checks"]["fresh_session"] = "FRESH_SESSION_HANDOFF_OK"
          evidence["observed_checks"]["persisted_checkpoint_fresh_clone"] = "PASS"
          evidence["final_confirmation_requested"] = False
          evidence_path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")

          current_path = root / ".state" / "CURRENT.json"
          current = json.loads(current_path.read_text(encoding="utf-8"))
          current["task"]["phase"] = "PHASE_D_BLOCKED_BRANCH_PROTECTION"
          current["task"]["task_contract_sha256"] = task_sha
          current["verification"]["full_regression_suite_passed"] = "58/58"
          current["verification"]["phase_d_tests_passed"] = "12/12"
          current["verification"]["phase_d_fresh_session_process_passed"] = True
          current["verification"]["phase_d_persisted_checkpoint_fresh_clone_passed"] = True
          current["verification"]["phase_d_ci_passed"] = True
          current["verification"]["phase_d_branch_protection_passed"] = False
          current["verification"]["latest_evidence_id"] = "PHASE-D-CI"
          steps = current["progress"].setdefault("completed_steps", [])
          for item in [
              "Commit-safe Git reconciliation implemented with content fingerprint and ancestor validation",
              "Persisted checkpoint -> fresh clone -> recover regression passed",
              "Committed non-state mutation after checkpoint is blocked",
              "Full regression suite passed 58/58",
              "Repository Control CI remote run 35512907861 passed: scope + 58/58 tests + fresh-session probe",
          ]:
              if item not in steps:
                  steps.append(item)
          current["progress"]["next_action"] = "Enable effective main branch protection/ruleset requiring Repository Control CI; PHASE_D_PASS remains blocked until observed."
          current["blocked"] = {
              "code": "PHASE_D_BRANCH_PROTECTION_BLOCKED",
              "detail": "GitHub rulesets returned 403 for this private repository without an eligible plan, and branch-protection visibility is not accessible through the connected integration; effective enforcement on main is not observed."
          }
          current_path.write_text(json.dumps(current, indent=2) + "\n", encoding="utf-8")
          PY

          python -B -m projectctl checkpoint             --reason "Synchronize Phase D blocked state after commit-safe recovery fix and remote CI"             --next-action "Enable effective main branch protection/ruleset requiring Repository Control CI; PHASE_D_PASS remains blocked until observed."

          python -B -m pytest -q -p no:cacheprovider tests
          python -B scripts/fresh_session_probe.py --root .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.yaml tasks/TASK-REPO-CONTROL-004.yaml evidence/PHASE-D-CI.json .state
          git commit -m "chore: synchronize Phase D blocked durable state"
          git push

