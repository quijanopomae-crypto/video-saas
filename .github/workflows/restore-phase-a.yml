name: Restore exact Phase A files
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact files and verify SHA-256
        shell: python
        run: |
          import gzip, hashlib
          from pathlib import Path

          files = {
              ".bootstrap/asset-manifest-v1.0.json.gz":
                  ("manifests/asset-manifest-v1.0.json", "efdbd11d56103eed85d14354b1f5cc5203a15ab1e63337fc3b65eb7ac0fe91aa"),
              ".bootstrap/bench100-cases-v1.1.jsonl.gz":
                  ("manifests/bench100-cases-v1.1.jsonl", "0072d8f4654b8319bc64fcdc370cac5b619f95687e0ed4e6a3477899d4bef7bb"),
              ".bootstrap/reference-conditioning-cases-v1.1.jsonl.gz":
                  ("manifests/reference-conditioning-cases-v1.1.jsonl", "72cd563ba34587e4cdecd29eb378466f6165f97fcad195cca39b1255dfefaac4"),
              ".bootstrap/frozen-manifest.schema.json.gz":
                  ("schemas/frozen-manifest.schema.json", "a458c077720d8d32d80fd858b821e412a44a5382639f771336f678f5ea057277"),
              ".bootstrap/pre-asset-freeze.schema.json.gz":
                  ("schemas/pre-asset-freeze.schema.json", "b928a067a5adb23af6080504e15da8fbd8131a74df930e1fbce0317ff0008b72"),
          }
          for src, (dst, expected) in files.items():
              raw = gzip.decompress(Path(src).read_bytes())
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA mismatch for {dst}: {actual} != {expected}")
              p=Path(dst)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(raw)
              print(dst, len(raw), actual)
      - name: Commit restored exact files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/asset-manifest-v1.0.json manifests/bench100-cases-v1.1.jsonl manifests/reference-conditioning-cases-v1.1.jsonl schemas/frozen-manifest.schema.json schemas/pre-asset-freeze.schema.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: restore exact Phase A baseline files"
          git push
