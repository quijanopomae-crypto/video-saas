services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_saas
      POSTGRES_USER: video_saas
      POSTGRES_PASSWORD: video_saas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_saas -d video_saas"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - video_saas_pgdata:/var/lib/postgresql/data

volumes:
  video_saas_pgdata:
