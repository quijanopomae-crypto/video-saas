schema_version: 1
task:
  id: TASK-VIDEO-CORE-001
  title: Implement canonical VideoProject contract
  status: DONE
  risk: MEDIUM
objective:
  expected_outcome: CANONICAL_VIDEO_PROJECT_CORE
scope:
  allowed_paths:
    - tasks/TASK-VIDEO-CORE-001.yaml
    - PROJECT_STATE.yaml
    - .state/**
    - apps/api/src/modules/video_project/**
    - apps/api/tests/test_video_project.py
